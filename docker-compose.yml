services:
  postgres:
    image: postgres:17-alpine
    container_name: agentic_rag_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst}
      POSTGRES_DB: ${POSTGRES_DB:-analyst}
    ports:
      # Host 5433 -> container 5432. Host 5432 is already taken on this machine.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyst} -d ${POSTGRES_DB:-analyst}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: agentic_rag_qdrant
    ports:
      - "6333:6333"   # REST + dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: agentic_rag_api
    env_file: .env
    environment:
      # Inside the compose network, containers reach each other by service name,
      # not localhost — .env's values are for the host-native workflow and stay
      # as they are so nothing else has to change.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
      # Local Ollama still runs on the host, not in compose (see analyst.llm /
      # ADR-002); Docker Desktop exposes it at host.docker.internal. On the AWS
      # target, set LLM_PROVIDER=groq in .env instead — there is no host Ollama there.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8400:8400"
    volumes:
      # /figures reads report PDFs straight off disk (see api.py); data/ is
      # gitignored and reproducible, so it is mounted, never baked into the image.
      # Read-write: the LLM cache (data/llm_cache.sqlite, analyst/llm.py) is written on
      # every uncached question, and SQLite needs the directory for its journal.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: agentic_rag_frontend
    environment:
      # Server-only (lib/api.ts): never exposed to the browser bundle. The
      # browser only ever talks to this container's own /api/* route handlers.
      API_URL: http://api:8400
      # Signs the session cookie and is sent to the API as X-API-Key (lib/session.ts).
      # Compose does not read .env files other than its own, so this passes it through.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      # Host 3300: 3000 is taken by other local projects on this machine.
      - "3300:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata:
