[project]
name = "multimodal-agentic-rag"
version = "0.1.0"
description = "Multimodal Agentic RAG over Indian equity filings, financials and market data"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "yfinance>=0.2.50",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pymupdf>=1.28.2",
    "pdfplumber>=0.11.10",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pandas-stubs",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001"]  # generated code
# Notebooks import per-cell by design, so file-level import rules do not apply.
# Everything else - unused names, bugs, line length - is still enforced.
"notebooks/*.ipynb" = ["E402", "I001", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# pymupdf ships no type stubs, so every call into it reads as untyped. Relaxing
# the rule for the two modules that touch it keeps strict mode everywhere else
# rather than weakening the whole project.
[[tool.mypy.overrides]]
module = ["analyst.parsing"]
disallow_untyped_calls = false
