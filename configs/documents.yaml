# Document manifest - the unstructured half of the corpus.
#
# The PDFs themselves are NEVER committed. This file plus scripts/download_docs.py
# reconstructs the corpus, and sha256 makes that reconstruction verifiable rather
# than merely hopeful.
#
# fetch:
#   auto   - scripted download works
#   manual - the IR site blocks automated requests (Akamai/Cloudflare). Download
#            once in a browser, drop it at the printed path, and the checksum
#            still guarantees everyone has the same bytes.
#
# fiscal_year is the year the FY ENDS (Indian FY 2024-25 -> 2025), matching
# facts.period_end so documents join to the oracle without a mapping table.

documents:
  # ---------- Energy ----------
  - ticker: RELIANCE
    doc_type: annual_report
    fiscal_year: 2025
    title: Integrated Annual Report 2024-25
    url: https://www.ril.com/reports/RIL-Integrated-Annual-Report-2024-25.pdf
    fetch: auto
    sha256: bb541a68a0440fd4e27527afbb79f9a0e7584ae430fe9af244700709cacc0769

